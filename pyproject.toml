[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epub2audiobook"
version = "0.1.0"
description = "Convert EPUB books into chaptered M4B audiobooks with local Kokoro TTS."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    # The web UI ships with the tool rather than as an extra. uv re-syncs
    # before every `uv run`, and an extra would be pruned by a plain
    # `uv run epub2ab serve` -- breaking the command that needs it. These are
    # a few MB next to PyTorch, so there is nothing to save by hiding them.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Opt-in: only useful if you have an Anthropic API key.
llm = ["anthropic>=0.49"]

# Dev tooling is a dependency group, not an extra: it is for people working on
# the project, never for people installing it. `uv sync` picks it up by default.
[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
epub2ab = "epub2audiobook.cli:app"

[project.urls]
Homepage = "https://github.com/shantam21/epub2audiobook"
Issues = "https://github.com/shantam21/epub2audiobook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/epub2audiobook"]

[tool.hatch.build.targets.wheel.force-include]
"src/epub2audiobook/server/static" = "epub2audiobook/server/static"
