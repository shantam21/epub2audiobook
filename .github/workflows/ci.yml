name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change that was never locked cannot reach main.
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # tsc runs in strict mode, so this is a type check as well as a build.
      - run: npm run build
        working-directory: frontend

      # The built UI is committed so `uv tool install` from git works without
      # Node. If a source change was not rebuilt, say so here rather than
      # shipping a stale bundle.
      - name: Check the committed build is up to date
        run: |
          if ! git diff --quiet -- ../src/epub2audiobook/server/static; then
            echo "::error::frontend/ changed but src/epub2audiobook/server/static was not rebuilt."
            git diff --stat -- ../src/epub2audiobook/server/static
            exit 1
          fi
        working-directory: frontend
